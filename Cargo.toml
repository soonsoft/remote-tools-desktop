[workspace]
resolver = "2"
members = [
    "core",
    # "src-tauri", # created in Task 7 — uncomment then
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
regex = "1"
walkdir = "2"
thiserror = "2"
ulid = "1"
